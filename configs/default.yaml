dataset:
  path: "data/ratings.csv"
  synthetic:
    num_users: 500
    num_items: 300
    seed: 7
    popularity_alpha: 1.2
    cluster_count: 10
    user_cluster_pref: 2
  min_user_ratings: 20
  min_item_ratings: 10
  split_fractions:
    train: 0.7
    val: 0.15
    test: 0.15

federated:
  num_clients: 500
  clients_per_round: 25
  num_rounds: 10
  local_epochs: 3
  batch_size: 128
  lr: 0.01
  seed: 7

model:
  embedding_dim: 32
  mlp_layers: [64, 32]
  dropout: 0.2

privacy:
  dp_enabled: true
  secagg_enabled: true
  he_enabled: false
  clip_norm: 1.0
  target_epsilon: 3.0
  target_delta: 1.0e-5
  noise_multiplier: null
  relax_with_secagg: true
  he:
    poly_modulus_degree: 8192
    coeff_mod_bit_sizes: [60, 40, 40, 60]
    global_scale: 1073741824

evaluation:
  top_k: [5, 10]
  metrics: ["rmse", "recall", "ndcg"]
  max_eval_users: 200

attacks:
  shadow_model_count: 3
  shadow_epochs: 6
  gradient_inversion_iters: 150
  gradient_inversion_lr: 0.05

experiment:
  output_dir: "outputs"
  device: "cpu"
  log_every: 1
